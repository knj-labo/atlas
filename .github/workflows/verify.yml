name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all -- --check
      - name: Check default dependency isolation
        run: |
          cargo tree --locked --edges normal --prefix none > "${RUNNER_TEMP}/atlas-default-dependencies.txt"
          if grep -E '^salsa(-[[:alnum:]_-]+)? v' "${RUNNER_TEMP}/atlas-default-dependencies.txt"; then
            echo "Default features unexpectedly include Salsa"
            exit 1
          fi
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --all-targets --features serde
      - run: cargo test --locked --all-targets --features incremental
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc
      - run: cargo test --locked --doc --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: npm ci --ignore-scripts
      - run: npm run test:conformance
