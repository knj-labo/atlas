[package]
name = "atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
oxc_allocator = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }
oxc_ast = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }
oxc_ast_visit = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }
oxc_diagnostics = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }
oxc_parser = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850", features = ["regular_expression"] }
oxc_semantic = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850", features = ["astro"] }
oxc_span = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }
oxc_syntax = { git = "https://github.com/jp-knj/oxc-atlas", rev = "8ef5b6a720bab87987dbc33f569af9d784c06850" }

lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["visitor"] }
cssparser = "=0.37.0"
html-escape = "=0.2.13"
serde = { version = "1.0", features = ["derive"], optional = true }
salsa = { version = "=0.28.5", optional = true, default-features = false, features = ["macros", "inventory"] }

[features]
serde = ["dep:serde"]
incremental = ["dep:salsa"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
insta = "=1.48.0"
serde_json = "1.0"

[[example]]
name = "spec-dump"
path = "tests/bin/spec_dump.rs"
required-features = ["serde"]

[[example]]
name = "atlas-report"
path = "examples/atlas_report.rs"
required-features = ["serde"]
